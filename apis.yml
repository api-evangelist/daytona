aid: daytona
name: Daytona
description: >-
  Daytona provides secure, elastic sandbox infrastructure for running
  AI-generated code, with sub-90ms sandbox creation, multi-language runtimes,
  and full filesystem, process, Git, and Language Server Protocol APIs.
  Sandboxes are stateful, snapshot-able, and deployable across US, EU, and
  Asia regions, and the platform supports HIPAA, SOC 2, and GDPR. Target
  customers are AI agent companies, coding-agent builders, data teams, RL
  labs, and enterprises that need to execute untrusted or LLM-authored code
  in isolation. Daytona ships Python and TypeScript SDKs (with Ruby, Go, and
  Java available) backed by a documented REST API and OpenAPI specs. Pricing
  is pay-as-you-go and per-second across vCPU, memory, GPU, and storage with a
  $200 free credit.
