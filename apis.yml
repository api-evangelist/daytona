        url: https://www.daytona.io/pricing
    features:
      - name: Fast Sandbox Creation
        description: Sub-90ms sandbox provisioning with no cold starts.
      - name: Process Execution
        description: Run code and OS commands with real-time output streaming.
      - name: Filesystem Operations
        description: Full CRUD on files with permission controls inside the sandbox.
      - name: Git Integration
        description: Native git operations and credential handling for cloning, committing, and pushing.
      - name: Language Server Protocol
        description: Multi-language completion, hover, and diagnostics through the Toolbox API.
      - name: Snapshots
        description: Save and restore sandbox state for resumable agent workflows.
      - name: Shared Volumes
        description: Mount shared storage across isolated sandboxes.
      - name: Multi-Region Deployment
        description: Run sandboxes in US, EU, and Asia regions to control data locality.
      - name: SSH and VS Code Access
        description: Browser-based VS Code and SSH access into running sandboxes.
      - name: Compliance
        description: HIPAA, SOC 2, and GDPR posture for regulated workloads.
    useCases:
      - name: AI Code Interpreters
        description: Execute LLM-generated Python or TypeScript safely behind chat or copilot UX.
      - name: Coding Agents
        description: Give autonomous coding agents a per-task workspace with git and editor tooling.
      - name: AI Evaluations
        description: Spin up fresh sandboxes for each eval run to keep state clean.
      - name: Computer Use Automation
        description: Pair with vision or control models to drive sandboxed desktops.
      - name: Reinforcement Learning
        description: Provide reproducible environments for tool-use RL.
      - name: Data Analysis
        description: Let agents load datasets and run analysis in isolation.
    integrations:
      - name: OpenAI
      - name: Anthropic
      - name: LangChain
      - name: LlamaIndex
      - name: CrewAI
      - name: Vercel AI SDK
      - name: AutoGen
      - name: GitHub
      - name: VS Code
    authentication:
      - type: API Key
        description: API keys generated from the Daytona dashboard or the Daytona API; configured via SDK, env vars (`DAYTONA_API_KEY`), or .env file.
