apis:
  - aid: daytona:sandbox-api
    name: Daytona Sandbox API
    description: >-
      The Daytona Sandbox API creates and manages isolated cloud sandboxes
      with process execution, filesystem operations, Git integration, and a
      Language Server Protocol toolbox. SDKs and the REST API let agents
      provision per-task environments, stream stdout/stderr, snapshot state,
      and share volumes.
    humanURL: https://www.daytona.io/docs
    baseURL: https://app.daytona.io/api
    tags:
